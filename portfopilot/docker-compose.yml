services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      PORTFOPILOT_MODE: ${PORTFOPILOT_MODE:-starter}
      PORTFOPILOT_SEED: ${PORTFOPILOT_SEED:-20261022}
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  frontend:
    build: ./frontend
    depends_on: { backend: { condition: service_healthy } }
    ports: ["8080:80"]
